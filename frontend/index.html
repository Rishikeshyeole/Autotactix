<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F9D58" />

    <title>AutoTactix — Intelligent Traffic Solutions</title>
    <meta
      name="description"
      content="AutoTactix uses AI, simulation, and Indian driver behavior analysis to identify traffic problems and generate practical solutions for smarter cities."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="AutoTactix — Intelligent Traffic Solutions" />
    <meta
      property="og:description"
      content="AutoTactix uses AI, simulation, and Indian driver behavior analysis to identify traffic problems and generate practical solutions for smarter cities."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Prevent flash of incorrect theme before React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('autotactix-theme');
          var theme = stored;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
