version: "3.9"

services:
  autotactix:
    build:
      context: .
      dockerfile: Dockerfile
    image: autotactix:latest
    container_name: autotactix
    ports:
      - "8000:8000"   # FastAPI dashboard + REST API
      - "6080:6080"   # noVNC — live SUMO simulation stream
    environment:
      - DISPLAY=:99
      - TRACI_PORT=8813
    volumes:
      # Persist uploaded SUMO networks, uploaded videos, and processed output
      # videos across container restarts/rebuilds.
      - ./networks:/app/networks
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    # sumo-gui + Xvfb + a browser-facing noVNC canvas are all more stable with
    # a larger shared-memory segment than Docker's 64MB default.
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Uncomment to run YOLO inference on an NVIDIA GPU (requires the NVIDIA
    # Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
