version: "3.9"

services:
  autotactix:
    build:
      context: .
      dockerfile: Dockerfile
    image: autotactix:latest
    container_name: autotactix
    ports:
      - "8000:8000"
      - "6080:6080"
    environment:
      - DISPLAY=:99
      - TRACI_PORT=8813
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./networks:/app/networks
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./static:/app/static
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s